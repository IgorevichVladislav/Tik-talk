<tt-input
  [formControl]="filterChatControl"
  class="tt-chat-list__search-input"
  placeholder="Искать..."
  type="text"
  mode="search"
  iconColor="light"
  filledActive
/>

@for (chat of filteredChats(); track chat.id) {
  <button
    chats
    [chat]="chat"
    [routerLink]="[chat.id]"
    routerLinkActive="tt-chat-btn__active-chat"
  ></button>
}
